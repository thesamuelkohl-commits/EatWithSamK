<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2V4D6ZQV6Q"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    // Consent Mode v2: everything starts denied, so no analytics or ad
    // cookies are written until the visitor chooses in the banner
    // (js/consent.js). This has to run before gtag('config') to count.
    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied'
    });

    gtag('js', new Date());

    gtag('config', 'G-2V4D6ZQV6Q');
  </script>

  <title>Page Not Found, Eat With Sam K</title>
  <meta name="description" content="That page doesn't exist. Find Sam's restaurant reviews, city guides, and the map of every rated spot instead." />
  <!-- A 404 should never be indexed, but crawlers should still follow the
       links out of it so they land back on real pages. -->
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" href="/images/favicon.png?v=2" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#c05a24" />
  <link rel="apple-touch-icon" href="/images/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Eat With Sam K" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=53" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="/"><img class="logo-img" src="/images/logo.png?v=2" alt="Eat With Sam K logo" /> Eat With Sam K</a>
      <nav class="main-nav" data-nav="" data-prefix="/"></nav>
      <div class="header-right">
        <div class="social-row" data-socials></div>
        <div class="auth-widget" data-auth></div>
        <div class="install-widget" data-install></div>
      </div>
    </div>
  </header>

  <main class="post-wrap error-wrap">
    <div class="error-page">
      <div class="post-emoji">🍽️</div>
      <h1>This plate came back empty</h1>
      <p class="error-lede">That page doesn't exist, moved, or never got written. Nothing you did wrong.</p>
      <p class="error-sub">Here's where the good stuff actually lives:</p>

      <div class="error-links">
        <a class="btn btn-primary" href="/reviews">Browse All Reviews</a>
        <a class="btn btn-ghost" href="/guides/">Guides</a>
        <a class="btn btn-ghost" href="/map">See the Map</a>
        <a class="btn btn-ghost" href="/">Back Home</a>
      </div>
    </div>
  </main>

  <footer class="site-footer" data-footer data-prefix="/"></footer>

  <script src="/js/data.js?v=24"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js?v=1"></script>
  <script src="/js/common.js?v=40"></script>
  <script src="/js/auth.js?v=5"></script>
  <script src="/js/pwa.js?v=2"></script>
  <script src="/js/consent.js?v=2"></script>
  <script>
    // Log what 404s so broken links are findable in Analytics rather than
    // silently costing traffic.
    if (typeof gtag === "function") {
      gtag("event", "page_not_found", { page_path: location.pathname, referrer: document.referrer || "(none)" });
    }
  </script>
</body>
</html>
