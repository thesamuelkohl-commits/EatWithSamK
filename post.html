<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2V4D6ZQV6Q"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-2V4D6ZQV6Q');
  </script>

  <title>Best Of Post, Eat With Sam K</title>
  <!-- Every guide now lives at its own real page under /guides/<id>/ — this
       page's only job is to send anyone who still has an old ?id= link
       there. It should never itself show up in search results (see the
       _redirects file — generate-reviews.js — for the server-side 301,
       which is what search engines actually follow; this noindex + JS
       redirect is the same-origin fallback for hosts that can't run
       server redirects, e.g. plain GitHub Pages). -->
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" href="images/favicon.png?v=2" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#c05a24" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Eat With Sam K" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=36" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="/"><img class="logo-img" src="images/logo.png?v=2" alt="Eat With Sam K logo" /> Eat With Sam K</a>
      <nav class="main-nav" data-nav="blog"></nav>
      <div class="header-right">
        <div class="social-row" data-socials></div>
        <div class="auth-widget" data-auth></div>
        <div class="install-widget" data-install></div>
      </div>
    </div>
  </header>

  <main class="post-wrap" id="post">
    <p>Redirecting…</p>
  </main>

  <footer class="site-footer" data-footer></footer>

  <script src="js/data.js?v=14"></script>
  <script src="js/blog-data.js?v=32"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=1"></script>
  <script src="js/common.js?v=28"></script>
  <script src="js/auth.js?v=3"></script>
  <script src="js/pwa.js?v=1"></script>
  <script>
    const id = new URLSearchParams(location.search).get("id");
    const post = BLOG_POSTS.find((p) => p.id === id);
    const el = document.getElementById("post");

    if (post) {
      location.replace(`/guides/${post.id}/`);
    } else {
      el.innerHTML = `
        <a class="post-back" href="/best-of">← Back to Best Of</a>
        <h1>Post not found 🤔</h1>
        <p>That post may have moved. Head back to Best Of to see everything.</p>`;
    }
  </script>
</body>
</html>
