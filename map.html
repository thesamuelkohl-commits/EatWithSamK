<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html"><img class="logo-img" src="images/logo.png?v=2" alt="Eat With Sam K logo" /> Eat With Sam K</a>
      <nav class="main-nav" data-nav="map"></nav>

        <div class="social-row" data-socials></div>
        <div class="auth-widget" data-auth></div>
        <div class="install-widget" data-install></div>
      </div>
    </div>
  </header>

  <section class="page-hero">
    <h1>The Map 🗺️</h1>
    <p>Every place I've eaten and rated, plotted in one place, tap a pin for the rating, the video review, and the full write-up.</p>
  </section>

  <section class="map-section map-page-section">
    <div class="container">
      <div class="filters-panel">
        <div class="filter-group">
          <span class="filter-group-label">Minimum Rating</span>
          <input type="range" id="rating-slider" min="0" max="10" step="0.5" value="0" aria-label="Minimum rating" />
          <span id="rating-slider-value">Showing all (0+ / 10)</span>
        </div>
        <div class="filter-group">
          <span class="filter-group-label">City</span>
          <select class="filter-select" id="filter-city"></select>
          <span class="filter-group-label">Cuisine</span>
          <select class="filter-select" id="filter-cuisine"></select>
        </div>
        <div class="filter-group" id="filter-price-group">
          <span class="filter-group-label">Price</span>
          <div class="filter-pills" id="filter-price"></div>
        </div>
        <div class="filter-group" id="filter-tags-group" hidden>
          <span class="filter-group-label">Tags</span>
          <div class="filter-pills" id="filter-tags"></div>
        </div>
        <div class="filter-group">
          <button type="button" class="filter-pill has-tooltip" id="filter-saved" data-tooltip="Only show places you've saved" aria-label="Only show places you've saved" tabindex="0">🤍 Saved Only</button>
        </div>
        <button type="button" class="btn btn-ghost filters-clear" id="filters-clear">Clear Filters</button>
      </div>
      <div id="map"></div>
    </div>
  </section>
